title: Ahmed Khaled
description: "Teaching computers, and humans, how to learn"
author: Ahmed Khaled

markdown: kramdown
kramdown:
  input: GFM

permalink: /blog/:year/:month/:day/:title/
timezone: Africa/Cairo

collections:
  research:
    output: true
    permalink: /research/:name/

defaults:
  - scope:
      path: ""
      type: research
    values:
      layout: research

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
