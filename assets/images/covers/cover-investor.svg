<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-investor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262118" />
      <stop offset="60%" stop-color="#3d3324" />
      <stop offset="100%" stop-color="#1c1811" />
    </linearGradient>
    <radialGradient id="glow-investor" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#b9472a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1c1811" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-investor)" />
  <rect width="800" height="450" fill="url(#glow-investor)" />

  <rect x="24" y="24" width="752" height="402" rx="14" fill="none" stroke="#d4af37" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Classical Merchant Balance Scale Motif -->
  <g transform="translate(400, 215)">
    <!-- Central Pillar -->
    <path d="M-8 120 L8 120 L5 -50 L-5 -50 Z" fill="#d4c5b0" opacity="0.8" />
    <!-- Pedestal Base -->
    <path d="M-40 135 L40 135 L30 120 L-30 120 Z" fill="#b9472a" />
    <rect x="-55" y="135" width="110" height="10" rx="3" fill="#1c1811" stroke="#d4af37" stroke-width="1.2" />

    <!-- Top Finial -->
    <circle cx="0" cy="-60" r="10" fill="#d4af37" />
    <circle cx="0" cy="-60" r="4" fill="#1c1811" />

    <!-- Balance Crossbeam -->
    <path d="M-125 -52 L125 -52 L110 -46 L-110 -46 Z" fill="#d4af37" />

    <!-- Left Pan -->
    <line x1="-115" y1="-46" x2="-145" y2="25" stroke="#d4c5b0" stroke-width="1.2" />
    <line x1="-115" y1="-46" x2="-85" y2="25" stroke="#d4c5b0" stroke-width="1.2" />
    <path d="M-155 25 Q-115 50 -75 25 Z" fill="#b9472a" stroke="#d4af37" stroke-width="1.2" />
    <!-- Golden Seeds / Coins on left -->
    <circle cx="-115" cy="22" r="7" fill="#d4af37" />
    <circle cx="-125" cy="23" r="6" fill="#fde8dd" />
    <circle cx="-105" cy="23" r="6" fill="#e8805f" />

    <!-- Right Pan (Higher — equilibrium of wisdom) -->
    <line x1="115" y1="-46" x2="85" y2="25" stroke="#d4c5b0" stroke-width="1.2" />
    <line x1="115" y1="-46" x2="145" y2="25" stroke="#d4c5b0" stroke-width="1.2" />
    <path d="M75 25 Q115 50 155 25 Z" fill="#b9472a" stroke="#d4af37" stroke-width="1.2" />
    <!-- Golden Coins on right -->
    <circle cx="115" cy="22" r="7" fill="#d4af37" />
    <circle cx="105" cy="23" r="6" fill="#fde8dd" />
    <circle cx="125" cy="23" r="6" fill="#e8805f" />

    <!-- Olive / Growth Branch at Background -->
    <path d="M0 70 Q70 65 90 100" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="2 3" opacity="0.6"/>
  </g>
</svg>
