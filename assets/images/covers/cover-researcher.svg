<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-researcher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d252c" />
      <stop offset="60%" stop-color="#2a333d" />
      <stop offset="100%" stop-color="#141a20" />
    </linearGradient>
    <radialGradient id="glow-researcher" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b9472a" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#e8805f" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#141a20" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-researcher)" />
  <rect width="800" height="450" fill="url(#glow-researcher)" />

  <rect x="24" y="24" width="752" height="402" rx="14" fill="none" stroke="#e8805f" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Scientific Astrolabe / Geometric Horizon Motif -->
  <g transform="translate(400, 225)">
    <!-- Outer concentric calibration rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#f5efe4" stroke-opacity="0.15" stroke-width="1.5" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#e8805f" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4 6" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="#f5efe4" stroke-opacity="0.2" stroke-width="1.5" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#b9472a" stroke-opacity="0.5" stroke-width="2" />
    <circle cx="0" cy="0" r="16" fill="#b9472a" fill-opacity="0.6" stroke="#f5efe4" stroke-width="1.5" />

    <!-- Degree markers -->
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#f5efe4" stroke-opacity="0.25" stroke-width="1" />
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#f5efe4" stroke-opacity="0.25" stroke-width="1" />
    <line x1="-99" y1="-99" x2="99" y2="99" stroke="#e8805f" stroke-opacity="0.3" stroke-width="1" />
    <line x1="99" y1="-99" x2="-99" y2="99" stroke="#e8805f" stroke-opacity="0.3" stroke-width="1" />

    <!-- Drafting Compass -->
    <path d="M0 -70 L-35 55" stroke="#f5efe4" stroke-width="3" stroke-linecap="round" />
    <path d="M0 -70 L35 55" stroke="#f5efe4" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="-70" r="7" fill="#b9472a" stroke="#f5efe4" stroke-width="1.5" />
    <path d="M-22 15 Q0 25 22 15" fill="none" stroke="#e8805f" stroke-width="2" />

    <!-- Radiating Ideas Constellation -->
    <circle cx="-160" cy="-60" r="3" fill="#e8805f" />
    <circle cx="-130" cy="-90" r="2" fill="#f5efe4" opacity="0.8" />
    <line x1="-160" y1="-60" x2="-130" y2="-90" stroke="#f5efe4" stroke-opacity="0.2" />
    <circle cx="150" cy="-70" r="3" fill="#e8805f" />
    <circle cx="180" cy="-40" r="2.5" fill="#f5efe4" opacity="0.8" />
    <line x1="150" y1="-70" x2="180" y2="-40" stroke="#f5efe4" stroke-opacity="0.2" />
  </g>
</svg>
