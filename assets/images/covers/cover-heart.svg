<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a1c10" />
      <stop offset="50%" stop-color="#7a2e12" />
      <stop offset="100%" stop-color="#240c06" />
    </linearGradient>
    <radialGradient id="glow-heart" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#fde8dd" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#e8805f" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#4a1c10" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-heart)" />
  <rect width="800" height="450" fill="url(#glow-heart)" />

  <!-- Frame border -->
  <rect x="24" y="24" width="752" height="402" rx="14" fill="none" stroke="#fde8dd" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Architectural Islamic Arch Motif -->
  <g transform="translate(400, 235)">
    <!-- Outer Arch -->
    <path d="M-130 170 L-130 20 C-130 -80 0 -150 0 -170 C0 -150 130 -80 130 20 L130 170 Z" 
          fill="none" stroke="#fde8dd" stroke-opacity="0.35" stroke-width="2.5" />
    <!-- Inner Arch -->
    <path d="M-105 170 L-105 30 C-105 -60 0 -125 0 -145 C0 -125 105 -60 105 30 L105 170 Z" 
          fill="#301108" fill-opacity="0.5" stroke="#e8805f" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- Hanging Lantern -->
    <line x1="0" y1="-145" x2="0" y2="-45" stroke="#fde8dd" stroke-opacity="0.6" stroke-width="1.5" />
    <!-- Lantern body -->
    <path d="M-14 -45 L14 -45 L20 -15 L12 15 L-12 15 L-20 -15 Z" fill="#e8805f" stroke="#fde8dd" stroke-width="1.5"/>
    <circle cx="0" cy="-15" r="7" fill="#fff" fill-opacity="0.9" />
    <circle cx="0" cy="-15" r="18" fill="#fde8dd" fill-opacity="0.25" />
    <path d="M0 15 L0 30" stroke="#fde8dd" stroke-width="1.5"/>

    <!-- Crescent Moon in Background -->
    <path d="M-40 -85 A 28 28 0 1 0 -2 -115 A 22 22 0 1 1 -40 -85 Z" fill="#fde8dd" opacity="0.85"/>

    <!-- Gentle Stars -->
    <circle cx="55" cy="-80" r="2.5" fill="#fde8dd" opacity="0.8"/>
    <circle cx="75" cy="-55" r="1.8" fill="#fde8dd" opacity="0.6"/>
    <circle cx="-65" cy="-50" r="1.5" fill="#fde8dd" opacity="0.5"/>
    <circle cx="40" cy="-105" r="1.5" fill="#fde8dd" opacity="0.6"/>
  </g>
</svg>
