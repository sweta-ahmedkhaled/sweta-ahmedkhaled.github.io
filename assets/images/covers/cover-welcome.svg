<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-welcome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1c18" />
      <stop offset="50%" stop-color="#2a241c" />
      <stop offset="100%" stop-color="#171512" />
    </linearGradient>
    <radialGradient id="lantern-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e8a85f" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#b9472a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1e1c18" stop-opacity="0" />
    </radialGradient>
    <pattern id="arabesque" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 30 L30 60 L0 30 Z" fill="none" stroke="#f5efe4" stroke-opacity="0.04" stroke-width="1.2"/>
      <circle cx="30" cy="30" r="10" fill="none" stroke="#b9472a" stroke-opacity="0.06" stroke-width="1"/>
      <path d="M0 0 L15 15 M60 0 L45 15 M0 60 L15 45 M60 60 L45 45" stroke="#f5efe4" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-welcome)" />
  <rect width="800" height="450" fill="url(#arabesque)" />
  <rect width="800" height="450" fill="url(#lantern-glow)" />

  <!-- Frame border -->
  <rect x="24" y="24" width="752" height="402" rx="14" fill="none" stroke="#e8a85f" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="8 6" />

  <!-- Central Motif: Open Book & Scholar Quill -->
  <g transform="translate(400, 225)">
    <!-- Aura -->
    <circle cx="0" cy="-10" r="110" fill="#e8a85f" fill-opacity="0.08" filter="blur(20px)" />
    
    <!-- Open Book Pages -->
    <!-- Left page -->
    <path d="M-10 40 C-60 35 -120 15 -140 -20 C-130 -60 -70 -50 -10 -35 Z" fill="#ece4d4" stroke="#d4c5b0" stroke-width="2"/>
    <!-- Left page lines -->
    <line x1="-120" y1="-15" x2="-25" y2="-28" stroke="#6f685b" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
    <line x1="-115" y1="5" x2="-25" y2="-8" stroke="#6f685b" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
    <line x1="-110" y1="25" x2="-25" y2="12" stroke="#6f685b" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>

    <!-- Right page -->
    <path d="M10 40 C60 35 120 15 140 -20 C130 -60 70 -50 10 -35 Z" fill="#f5efe4" stroke="#d4c5b0" stroke-width="2"/>
    <!-- Right page lines -->
    <line x1="25" y1="-28" x2="120" y2="-15" stroke="#b9472a" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="-8" x2="115" y2="5" stroke="#6f685b" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="12" x2="110" y2="25" stroke="#6f685b" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>

    <!-- Book Spine -->
    <path d="M-10 -35 C0 -30 0 -30 10 -35 L10 40 C0 45 0 45 -10 40 Z" fill="#b9472a"/>

    <!-- Bookmark ribbon -->
    <path d="M0 -30 Q5 15 20 60 L10 55 L0 60 Z" fill="#e8a85f"/>

    <!-- Inkwell & Feather Quill -->
    <g transform="translate(145, 10)">
      <path d="M-15 35 L15 35 L12 15 L-12 15 Z" fill="#171512" stroke="#b9472a" stroke-width="1.5"/>
      <path d="M-10 15 L10 15 L8 8 L-8 8 Z" fill="#e8a85f"/>
      <!-- Quill -->
      <path d="M0 10 C15 -30 45 -70 80 -100 C75 -80 60 -50 40 -30 C30 -20 15 -10 0 10" fill="#f5efe4" opacity="0.9"/>
      <path d="M0 10 C15 -30 45 -70 80 -100" stroke="#b9472a" stroke-width="1.2" fill="none"/>
    </g>

    <!-- Radiant Star / Compass at Top -->
    <g transform="translate(0, -95)">
      <circle cx="0" cy="0" r="14" fill="#e8a85f" fill-opacity="0.2"/>
      <path d="M0 -22 L4 -6 L20 -4 L6 5 L10 21 L0 10 L-10 21 L-6 5 L-20 -4 L-4 -6 Z" fill="#e8a85f"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>
  </g>
</svg>
