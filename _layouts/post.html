---
layout: default
---
<article class="section">
  <div class="section-inner post">
    <a class="back-link" href="{{ '/' | relative_url }}#blog">&larr; Back to Blog</a>
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
    <div class="post-body">
      {{ content }}
    </div>
  </div>
</article>
