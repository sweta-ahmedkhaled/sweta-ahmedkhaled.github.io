---
layout: default
---
<article class="section post-article" dir="rtl" lang="ar">
  <div class="section-inner post">
    <a class="back-link" href="{{ '/' | relative_url }}#blog">
      <span class="back-arrow">&rarr;</span> العودة للمدونة
    </a>
    <header class="post-header">
      <div class="post-meta">
        {% include date.html date=page.date %}
        {% if page.categories.size > 0 %}
          <span class="meta-sep">&bull;</span>
          <span class="post-category">{{ page.categories | first }}</span>
        {% endif %}
      </div>
      <h1 class="post-title">{{ page.title }}</h1>
    </header>
    {% if page.image %}
    <div class="post-cover">
      <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
    </div>
    {% endif %}
    <div class="post-body">
      {{ content }}
    </div>
  </div>
</article>
