---
layout: default
---
<article class="section">
  <div class="section-inner post">
    <a class="back-link" href="{{ '/' | relative_url }}#research">&larr; Back to Research</a>
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-date">
      {{ page.year }}{% if page.venue %} &middot; {{ page.venue }}{% endif %}
    </p>
    {% if page.links %}
    <p class="post-date research-links">
      {% for link in page.links %}<a href="{{ link.url }}">{{ link.name }}</a>{% unless forloop.last %} &middot; {% endunless %}{% endfor %}
    </p>
    {% endif %}
    <div class="post-body">
      {{ content }}
    </div>
  </div>
</article>
